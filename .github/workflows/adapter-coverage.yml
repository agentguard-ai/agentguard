name: Adapter coverage

on:
  pull_request:
    paths:
      - "packages/haystack-tealtiger/**"
      - "packages/camelai-tealtiger/**"
      - "packages/pydanticai-tealtiger/**"
      - "packages/tealtiger-ai-sdk/**"
      - ".github/workflows/adapter-coverage.yml"
  push:
    branches: [main]
    paths:
      - "packages/haystack-tealtiger/**"
      - "packages/camelai-tealtiger/**"
      - "packages/pydanticai-tealtiger/**"
      - "packages/tealtiger-ai-sdk/**"
      - ".github/workflows/adapter-coverage.yml"

permissions:
  contents: read

jobs:
  python-adapters:
    name: Python adapter coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - haystack-tealtiger
          - camelai-tealtiger
          - pydanticai-tealtiger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install hash-pinned test tools
        working-directory: packages/${{ matrix.package }}
        run: python -m pip install --require-hashes -r ../../.github/adapter-coverage-requirements.txt
      - name: Run coverage
        working-directory: packages/${{ matrix.package }}
        env:
          PYTHONPATH: src
        run: pytest --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: packages/${{ matrix.package }}/coverage.xml
          flags: ${{ matrix.package }}
          fail_ci_if_error: false

  typescript-adapter:
    name: TypeScript adapter coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/tealtiger-ai-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/tealtiger-ai-sdk/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          directory: packages/tealtiger-ai-sdk/coverage
          flags: tealtiger-ai-sdk
          fail_ci_if_error: false
