[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "langgraph-tealtiger"
version = "0.1.0"
description = "Deterministic governance middleware for LangGraph — conditional routing, policy enforcement, PII detection, and structured audit evidence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "TealTiger Team", email = "reachout@tealtiger.ai"},
]
keywords = [
    "langgraph",
    "agents",
    "governance",
    "security",
    "ai-agents",
    "guardrails",
    "policy",
    "tealtiger",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=0.0.21",
    "langchain-core>=0.1.30",
    "tealtiger>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tealtiger"]
